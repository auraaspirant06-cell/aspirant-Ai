[project]
name = "aspirant-ai"
version = "0.1.0"
description = "ASPIRANT AI — Modular, voice-first, secure personal AI desktop assistant for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "celery>=5.7.0",
    "chromadb>=1.5.9",
    "cryptography>=46.0.0",
    "dulwich>=1.2.22",
    "edge-tts>=7.3.1",
    "fastapi>=0.135.0",
    "faster-whisper>=1.2.1",
    "google-genai>=3.5.0",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.8.1",
    "numpy>=2.5.5",
    "openai>=2.0.0",
    "pillow>=12.0.0",
    "playwright>=1.65.2",
    "psutil>=7.0.0",
    "psycopg[binary]>=3.3.9",
    "pyautogui>=0.9.54",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.9.0",
    "pyjwt>=2.15.1",
    "PySide6>=6.10.0",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.34",
    "qdrant-client>=1.20.0",
    "redis>=8.2.0",
    "sounddevice>=0.5.6",
    "sqlalchemy>=2.0.36,<2.1",
    "uvicorn[standard]>=0.40.0",
    "webrtcvad-wheels>=2.0.14.post1",
    "websockets>=15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
]

[project.scripts]
aspirant = "aspirant.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aspirant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
