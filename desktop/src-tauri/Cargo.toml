[package]
name = "aspirant-ai-tauri"
version = "2.0.0"
description = "Tauri desktop compatibility shell for Aspirant AI NOVA"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-notification = "2.0"
